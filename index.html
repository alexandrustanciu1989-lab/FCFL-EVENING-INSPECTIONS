<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Truck Check</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.topbar {
  background: white;
  border-bottom: 1px solid #dfe3e8;
  padding: 18px 16px 10px;
}

.top-inner {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.gear {
  width: 50px;
  height: 46px;
  border: 0;
  border-radius: 10px;
  background: #eef4ff;
  font-size: 22px;
  cursor: pointer;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 14px;
  padding-bottom: 100px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.tab {
  border: 0;
  border-radius: 10px;
  padding: 14px 8px;
  font-size: 16px;
  font-weight: 700;
  background: #e5e7eb;
  color: #0b7de3;
  cursor: pointer;
}

.tab.active {
  background: #1467d8;
  color: white;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 5px 16px rgba(0,0,0,.06);
}

.page {
  display: none;
}

.page.active {
  display: block;
}

label {
  display: block;
  font-weight: 700;
  margin: 13px 0 6px;
}

select,
input[type="text"] {
  width: 100%;
  height: 50px;
  border: 1px solid #cfd5dc;
  border-radius: 11px;
  padding: 0 14px;
  font-size: 16px;
  background: white;
}

.photo-main {
  width: 100%;
  min-height: 64px;
  border: 2px dashed #9dbce6;
  border-radius: 14px;
  background: #f8fbff;
  color: #1467d8;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}

.note-row {
  display: grid;
  grid-template-columns: 1fr 52px;
  gap: 8px;
  margin-bottom: 8px;
}

.note-row input {
  width: 100%;
  height: 46px;
  border: 1px solid #cfd5dc;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 15px;
}

.add-photo {
  border: 0;
  border-radius: 10px;
  background: #eef4ff;
  color: #1467d8;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.preview-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.preview-row img {
  width: 82px;
  height: 82px;
  object-fit: cover;
  border-radius: 10px;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.status-btn {
  height: 46px;
  border-radius: 10px;
  background: white;
  border: 1px solid #d2d6dc;
  font-weight: 700;
  cursor: pointer;
}

.status-btn.selected-ready {
  background: #e8f8ed;
  border-color: #3fb85a;
  color: #187533;
}

.status-btn.selected-repair {
  background: #fff8dc;
  border-color: #e0b63d;
  color: #835f00;
}

.status-btn.selected-oos {
  background: #fde8e8;
  border-color: #e88f8f;
  color: #a92020;
}

.submit {
  width: 100%;
  height: 52px;
  margin-top: 14px;
  border: 0;
  border-radius: 11px;
  background: #1467d8;
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.truck-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 4px;
  border-bottom: 1px solid #edf0f3;
}

.left-truck {
  display: flex;
  align-items: center;
  gap: 9px;
}

.dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.dot.green {
  background: #22c55e;
}

.dot.yellow {
  background: #eab308;
}

.dot.red {
  background: #ef4444;
}

.dot.gray {
  background: #aeb4bc;
}

.issue-card {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 11px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.issue-red {
  border-left: 7px solid #ef4444;
}

.issue-yellow {
  border-left: 7px solid #eab308;
}

.issue-green {
  border-left: 7px solid #22c55e;
}

.small {
  font-size: 13px;
  color: #6b7280;
}

.resolve-btn {
  border: 0;
  border-radius: 9px;
  background: #1467d8;
  color: white;
  padding: 10px 13px;
  font-weight: 700;
  cursor: pointer;
}

.settings-section {
  margin-bottom: 20px;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  border-top: 1px solid #dfe3e8;
  padding: 9px 14px 12px;
}

.bottom-inner {
  max-width: 760px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.bottom-btn {
  height: 50px;
  border: 0;
  border-radius: 11px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

.bottom-primary {
  background: #1467d8;
  color: white;
}

.bottom-secondary {
  background: #e8f0ff;
  color: #1553a7;
}

.hidden {
  display: none;
}

.history-item {
  border-bottom: 1px solid #eceff2;
  padding: 13px 0;
}

.warning {
  background: #fff6df;
  border: 1px solid #f2d48e;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="top-inner">
    <div class="logo">🚛 Daily Truck Check</div>
    <button class="gear" onclick="showPage('settings')">⚙️</button>
  </div>
</div>

<div class="container">

  <div class="tabs">
    <button id="tab-new" class="tab active" onclick="showPage('new')">New Check</button>
    <button id="tab-issues" class="tab" onclick="showPage('issues')">Open Issues</button>
    <button id="tab-history" class="tab" onclick="showPage('history')">History</button>
  </div>

  <section id="new" class="page active">
    <div class="card">

      <label>Truck</label>
      <select id="truckSelect"></select>

      <label>Photos</label>
      <button class="photo-main" type="button" onclick="document.getElementById('mainPhoto').click()">
        📸 Take / Add Pictures
      </button>

      <input
        id="mainPhoto"
        class="hidden"
        type="file"
        accept="image/*"
        capture="environment"
        multiple
        onchange="handleMainPhotos(this)"
      >

      <div id="mainPhotoPreview" class="preview-row"></div>

      <label>Problems / Notes</label>

      <div id="notesArea"></div>

      <label>Status</label>

      <div class="status-grid">
        <button id="readyBtn" class="status-btn selected-ready" onclick="setStatus('READY')">
          ✅ Ready
        </button>

        <button id="repairBtn" class="status-btn" onclick="setStatus('REPAIR')">
          ⚠️ Repair
        </button>

        <button id="oosBtn" class="status-btn" onclick="setStatus('OOS')">
          🛑 OOS
        </button>
      </div>

      <label>Driver / Inspector</label>
      <input id="driverName" type="text" placeholder="Name">

      <button class="submit" onclick="submitTruck()">
        SUBMIT TRUCK
      </button>

    </div>
  </section>

  <section id="issues" class="page">
    <div id="issuesList"></div>
  </section>

  <section id="history" class="page">
    <div class="card">
      <div id="historyList"></div>
    </div>
  </section>

  <section id="settings" class="page">

    <div class="card">

      <h2>Settings</h2>

      <div class="warning">
        This is still the test version. The admin and guest controls are not secure logins yet.
      </div>

      <div class="settings-section">
        <h3>Administrator</h3>
        <input id="adminName" type="text" placeholder="Admin name">
        <button class="submit" onclick="saveAdmin()">Save Admin</button>
      </div>

      <div class="settings-section">
        <h3>Add Truck</h3>
        <input id="newTruckName" type="text" placeholder="Example: FCFL116">
        <button class="submit" onclick="addTruck()">Add Truck</button>
      </div>

      <div class="settings-section">
        <h3>Current Trucks</h3>
        <div id="truckSettingsList"></div>
      </div>

      <div class="settings-section">
        <h3>Guest Users</h3>

        <input id="guestName" type="text" placeholder="Employee name">

        <button class="submit" onclick="addGuest()">
          Add Guest User
        </button>

        <div id="guestList"></div>
      </div>

    </div>

  </section>

</div>

<div class="bottom-nav">
  <div class="bottom-inner">
    <button class="bottom-btn bottom-primary" onclick="showPage('new')">
      ➕ New Check
    </button>

    <button class="bottom-btn bottom-secondary" onclick="showPage('issues')">
      🔧 Open Issues
    </button>
  </div>
</div>

<script>

const defaultTrucks = [
  "FCFL103",
  "FCFL105",
  "FCFL107",
  "FCFL108",
  "FCFL109",
  "FCFL111",
  "FCFL112",
  "FCFL113",
  "FCFL114",
  "FCFL115",
  "FCFL R2",
  "FCFL R4",
  "FCFL R7",
  "FCFL R9"
];

let trucks =
  JSON.parse(localStorage.getItem("fcfl_trucks_v3")) ||
  defaultTrucks;

let inspections =
  JSON.parse(localStorage.getItem("fcfl_inspections_v3")) ||
  [];

let issues =
  JSON.parse(localStorage.getItem("fcfl_issues_v3")) ||
  [];

let guests =
  JSON.parse(localStorage.getItem("fcfl_guests_v3")) ||
  [];

let admin =
  localStorage.getItem("fcfl_admin_v3") || "";

let currentStatus = "READY";

let notePhotos = [[], [], [], [], []];

let mainPhotos = [];


function saveData() {

  localStorage.setItem(
    "fcfl_trucks_v3",
    JSON.stringify(trucks)
  );

  localStorage.setItem(
    "fcfl_inspections_v3",
    JSON.stringify(inspections)
  );

  localStorage.setItem(
    "fcfl_issues_v3",
    JSON.stringify(issues)
  );

  localStorage.setItem(
    "fcfl_guests_v3",
    JSON.stringify(guests)
  );

}


function showPage(pageName) {

  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  document.getElementById(pageName)
    .classList.add("active");

  document.querySelectorAll(".tab")
    .forEach(tab => tab.classList.remove("active"));

  if (pageName === "new") {
    document.getElementById("tab-new").classList.add("active");
  }

  if (pageName === "issues") {
    document.getElementById("tab-issues").classList.add("active");
  }

  if (pageName === "history") {
    document.getElementById("tab-history").classList.add("active");
  }

  refresh();

}


function makeNotes() {

  const area = document.getElementById("notesArea");

  area.innerHTML = "";

  for (let i = 0; i < 5; i++) {

    const holder = document.createElement("div");

    holder.innerHTML = `
      <div class="note-row">

        <input
          id="note${i}"
          type="text"
          placeholder="Problem / note ${i + 1}"
        >

        <button
          class="add-photo"
          type="button"
          onclick="document.getElementById('notePhoto${i}').click()">
          +
        </button>

      </div>

      <input
        id="notePhoto${i}"
        class="hidden"
        type="file"
        accept="image/*"
        capture="environment"
        multiple
        onchange="handleNotePhotos(${i}, this)"
      >

      <div
        id="notePreview${i}"
        class="preview-row">
      </div>
    `;

    area.appendChild(holder);

  }

}


function fileToDataUrl(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


async function handleMainPhotos(input) {

  for (const file of input.files) {

    const data = await fileToDataUrl(file);

    mainPhotos.push(data);

  }

  renderMainPhotos();

}


function renderMainPhotos() {

  document.getElementById("mainPhotoPreview").innerHTML =
    mainPhotos
      .map(photo => `<img src="${photo}">`)
      .join("");

}


async function handleNotePhotos(index, input) {

  for (const file of input.files) {

    const data = await fileToDataUrl(file);

    notePhotos[index].push(data);

  }

  renderNotePhotos(index);

}


function renderNotePhotos(index) {

  document.getElementById("notePreview" + index).innerHTML =
    notePhotos[index]
      .map(photo => `<img src="${photo}">`)
      .join("");

}


function setStatus(status) {

  currentStatus = status;

  document.getElementById("readyBtn").className = "status-btn";
  document.getElementById("repairBtn").className = "status-btn";
  document.getElementById("oosBtn").className = "status-btn";

  if (status === "READY") {
    document.getElementById("readyBtn")
      .classList.add("selected-ready");
  }

  if (status === "REPAIR") {
    document.getElementById("repairBtn")
      .classList.add("selected-repair");
  }

  if (status === "OOS") {
    document.getElementById("oosBtn")
      .classList.add("selected-oos");
  }

}


function statusColor(status) {

  if (status === "READY") return "green";

  if (status === "REPAIR") return "yellow";

  if (status === "OOS") return "red";

  return "gray";

}


function latestStatusForTruck(truck) {

  const record =
    inspections.find(item => item.truck === truck);

  if (!record) return "gray";

  return statusColor(record.status);

}


function submitTruck() {

  const truck =
    document.getElementById("truckSelect").value;

  const driver =
    document.getElementById("driverName").value.trim();

  const notes = [];

  for (let i = 0; i < 5; i++) {

    const text =
      document.getElementById("note" + i).value.trim();

    if (text || notePhotos[i].length) {

      notes.push({
        text: text,
        photos: notePhotos[i]
      });

    }

  }

  const record = {

    id: Date.now(),

    truck: truck,

    driver: driver || "Not entered",

    status: currentStatus,

    notes: notes,

    photos: mainPhotos,

    timestamp: new Date().toLocaleString()

  };

  inspections.unshift(record);


  if (
    currentStatus === "REPAIR" ||
    currentStatus === "OOS"
  ) {

    issues.unshift({

      id: Date.now() + 1,

      truck: truck,

      status:
        currentStatus === "OOS"
          ? "red"
          : "yellow",

      description:
        notes.length
          ? notes
              .map(note => note.text)
              .filter(Boolean)
              .join(" • ")
          : currentStatus === "OOS"
            ? "Truck marked Out of Service"
            : "Truck requires repair",

      reportedBy: driver || "Not entered",

      resolved: false,

      timestamp: new Date().toLocaleString()

    });

  }

  saveData();

  resetForm();

  refresh();

  alert("Truck check saved.");

}


function resetForm() {

  document.getElementById("driverName").value = "";

  mainPhotos = [];

  notePhotos = [[], [], [], [], []];

  currentStatus = "READY";

  makeNotes();

  renderMainPhotos();

  setStatus("READY");

}


function resolveIssue(id) {

  if (!admin) {

    alert("Set the administrator name in Settings first.");

    return;

  }

  const entered =
    prompt("Enter administrator name:");

  if (!entered) return;

  if (
    entered.trim().toLowerCase()
    !== admin.trim().toLowerCase()
  ) {

    alert("Only the administrator can resolve this issue.");

    return;

  }

  const issue =
    issues.find(item => item.id === id);

  if (!issue) return;

  issue.resolved = true;

  issue.resolvedAt =
    new Date().toLocaleString();

  saveData();

  refresh();

}


function saveAdmin() {

  admin =
    document.getElementById("adminName")
      .value
      .trim();

  localStorage.setItem(
    "fcfl_admin_v3",
    admin
  );

  alert("Administrator saved.");

}


function addTruck() {

  let name =
    document.getElementById("newTruckName")
      .value
      .trim();

  if (!name) return;

  if (
    !name.toUpperCase().startsWith("FCFL")
  ) {

    name = "FCFL" + name;

  }

  if (!trucks.includes(name)) {

    trucks.push(name);

  }

  document.getElementById("newTruckName").value = "";

  saveData();

  refresh();

}


function addGuest() {

  const name =
    document.getElementById("guestName")
      .value
      .trim();

  if (!name) return;

  guests.push({
    name: name,
    role: "Inspector"
  });

  document.getElementById("guestName").value = "";

  saveData();

  refresh();

}


function refresh() {

  const options =
    trucks
      .map(truck =>
        `<option value="${truck}">${truck}</option>`
      )
      .join("");

  document.getElementById("truckSelect").innerHTML =
    options;


  document.getElementById("issuesList").innerHTML =
    renderIssues();


  document.getElementById("historyList").innerHTML =
    renderHistory();


  document.getElementById("truckSettingsList").innerHTML =
    trucks
      .map(truck => `
        <div class="truck-line">

          <div class="left-truck">

            <span
              class="dot ${latestStatusForTruck(truck)}">
            </span>

            <strong>${truck}</strong>

          </div>

        </div>
      `)
      .join("");


  document.getElementById("guestList").innerHTML =
    guests.length
      ? guests
          .map(guest => `
            <div class="truck-line">
              <div>
                <strong>${guest.name}</strong>
                <div class="small">
                  Guest / Inspector
                </div>
              </div>
            </div>
          `)
          .join("")
      : `<p class="small">No guest users added.</p>`;


  document.getElementById("adminName").value =
    admin;

}


function renderIssues() {

  const priority = {
    red: 1,
    yellow: 2,
    green: 3
  };

  const openIssues =
    issues
      .filter(issue => !issue.resolved)
      .sort(
        (a, b) =>
          priority[a.status] -
          priority[b.status]
      );

  if (!openIssues.length) {

    return `
      <div class="card">
        <strong>No open truck issues.</strong>
      </div>
    `;

  }

  return openIssues
    .map(issue => `

      <div class="issue-card issue-${issue.status}">

        <div class="left-truck">

          <span class="dot ${issue.status}"></span>

          <h3 style="margin:0;">
            ${issue.truck}
          </h3>

        </div>

        <p>${issue.description}</p>

        <p class="small">
          Reported by: ${issue.reportedBy}
          <br>
          ${issue.timestamp}
        </p>

        <strong>
          ${
            issue.status === "red"
              ? "🛑 OUT OF SERVICE"
              : issue.status === "yellow"
                ? "⚠️ NEEDS REPAIR"
                : "✅ MONITOR"
          }
        </strong>

        <br><br>

        <button
          class="resolve-btn"
          onclick="resolveIssue(${issue.id})">
          Mark Resolved
        </button>

      </div>

    `)
    .join("");

}


function renderHistory() {

  if (!inspections.length) {

    return `<p>No history yet.</p>`;

  }

  return inspections
    .map(item => `

      <div class="history-item">

        <div class="left-truck">

          <span
            class="dot ${statusColor(item.status)}">
          </span>

          <strong>${item.truck}</strong>

        </div>

        <p>
          Status:
          <strong>${item.status}</strong>
        </p>

        <p>
          Inspector:
          ${item.driver}
        </p>

        ${
          item.notes.length
            ? item.notes
                .map(note => `
                  <p>
                    ${note.text || "Photo attached"}
                  </p>
                `)
                .join("")
            : `<p class="small">No notes.</p>`
        }

        <div class="preview-row">

          ${
            item.photos
              ? item.photos
                  .map(photo =>
                    `<img src="${photo}">`
                  )
                  .join("")
              : ""
          }

        </div>

        <div class="small">
          ${item.timestamp}
        </div>

      </div>

    `)
    .join("");

}


makeNotes();

refresh();

</script>

</body>
</html>
